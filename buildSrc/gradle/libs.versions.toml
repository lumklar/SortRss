[versions]
# 核心库版本（建议使用最新稳定版）
commons-compress = "1.28.0"

# 可选压缩库版本（根据实际需要添加）
xz = "1.12"                   # 用于 XZ / LZMA
brotli = "0.1.2"              # 用于 Brotli
zstd-jni = "1.5.7-12"          # 用于 Zstandard
lz4-java = "1.8.0"            # 用于 LZ4
snappy-java = "1.1.10.5"      # 用于 Snappy

# 插件版本
ben-manes-versions = "0.59.0"

[libraries]
# 核心库
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commons-compress" }

# 可选压缩库（按需添加）
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
brotli = { group = "org.brotli", name = "dec", version.ref = "brotli" }
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstd-jni" }
lz4-java = { group = "org.lz4", name = "lz4-java", version.ref = "lz4-java" }
snappy-java = { group = "org.xerial.snappy", name = "snappy-java", version.ref = "snappy-java" }

[plugins]
ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "ben-manes-versions" }

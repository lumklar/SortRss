# 临时版本覆盖声明（由 gradle/version-overrides.gradle.kts 读取）
#
# 格式：<Spring Boot BOM 属性名>=<根版本目录中的 version 别名>
# 示例：tomcat.version=security-tomcat
#
# 规则：
# 1. 版本号只能写在 gradle/libs.versions.toml 的 [versions] 中，别名建议使用 security- 前缀；
# 2. 脚本在配置期把版本写入 extra，供 Spring Dependency Management 的 BOM 属性覆盖使用；
# 3. checkVersionOverrides 会解析当前 Spring Boot BOM，若 BOM 版本已不低于覆盖版本，
#    构建会失败并要求同时删除这里的声明和版本目录中的别名。
#
# 当前没有生效的临时覆盖。

name: Deploy GitHub Pages

on:
  push:
    branches: [main]       # main 分支推送时触发
  workflow_dispatch:         # 允许手动在 Actions 页面触发

# 关键权限：允许 GitHub Token 向 gh-pages 分支推送代码
permissions:
  contents: write
  pages: write
  id-token: write

# 并发控制，防止页面被覆盖
concurrency:
  group: "page"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 0. 检出代码（获取全部分支历史，以便操作 docs 分支）
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0           # ★ 必须，才能查看远程分支

      # ------------------------------------------------------------
      # 1. 设置 JDK（Gradle 运行环境）
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # ------------------------------------------------------------
      # 2. 配置 Gradle（自动开启缓存，加速构建）
      # ------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # 3. 设置 Python 环境（mike 需要）
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.*'
          cache: 'pip'                # 自动缓存 ~/.cache/pip

      # ------------------------------------------------------------
      # 4. 配置 Git 身份（用于创建/推送 docs 分支）
      # ------------------------------------------------------------
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------------
      # 5. 确保 docs 分支存在（若不存在则创建空分支）
      # ------------------------------------------------------------
      - name: Ensure docs branch exists
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          CURRENT_BRANCH=$(git branch --show-current)
          # 检查远程是否存在 docs 分支
          if git ls-remote --heads origin docs | grep -q docs; then
            echo "docs branch exists, updating local docs branch to match remote..."
            # 强制拉取远程 docs 到本地 docs（不切换分支）
            git fetch origin +docs:docs
          else
            echo "docs branch not found, creating empty orphan branch..."
            git checkout --orphan docs
            git rm -rf . > /dev/null 2>&1
            git commit --allow-empty -m "Initial empty docs branch"
            git push origin docs
            git checkout $CURRENT_BRANCH
          fi

      # ------------------------------------------------------------
      # 6. 部署文档（latest 版本）到 docs 分支
      # ------------------------------------------------------------
      - name: Deploy documentation (mike latest)
        run: ./gradlew mikeDeployLatest

      # ------------------------------------------------------------
      # 7. 构建 WASM JS 产物（原有任务）
      # ------------------------------------------------------------
      - name: Build WASM JS distribution
        run: ./gradlew :home:prepareDistributionWithMike
        env:
          FLAVOR_DATA: mock   # 这里注入，Gradle 中可通过 System.getenv("FLAVOR_DATA") 读取

      # ------------------------------------------------------------
      # 8. 部署到 GitHub Pages（推送到 gh-pages 分支）
      #    产物路径: home/build/dist
      # ------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./home/build/dist
          publish_branch: gh-pages    # 目标分支，GitHub Pages 默认读取这个分支
          # force_orphan: true          # 强制清空历史记录，保持分支干净（推荐）。V4不支持该参数
          # 可选：保留已部署文件的版本历史，如果想保留，设为 false
          # keep_files: false

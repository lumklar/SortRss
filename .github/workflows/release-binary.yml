name: Release Binary
# TODO 支持网页上手动发布时执行ci/cd
# TODO 发布前校验tag，commit，gradle.properties中版本是否一致

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 架构无关的组（仅需在一个平台上构建一次）
          - group: server
            os: ubuntu-latest
          - group: web
            os: ubuntu-latest

          # Android（架构无关；签名密钥由 repository secrets 注入）
          - group: android
            os: ubuntu-latest

          # Windows（提供 x64 和 arm64）
          - group: win
            os: windows-latest
          - group: win
            os: windows-11-arm

# TODO 编译mac产物
          # macOS（同时提供 Intel 和 Apple Silicon）
#          - group: mac
#            os: macos-15-intel          # Intel x64
#          - group: mac
#            os: macos-15          # Apple Silicon arm64

          # Linux（提供 x64 和 arm64；deb/rpm/AppImage 名称带架构后缀，互不冲突）
          - group: linux
            os: ubuntu-latest     # x64
          - group: linux
            os: ubuntu-24.04-arm  # arm64

    steps:
      - uses: actions/checkout@v7

      # ------------------------------------------------------------
      # 1. 安装所有需要的 JDK，供 Gradle Toolchain 自动识别
      #    Gradle 会扫描这些安装路径
      # ------------------------------------------------------------
      - name: Set up JDK 25 (用于 toolchain 编译)
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'oracle'        # Temurin 可能暂无 25，Oracle 提供早期版本
        continue-on-error: true         # 若安装失败，Gradle 会自动下载，不影响构建

      - name: Set up JDK 21 (用于运行 Gradle 守护进程)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # compileSdk 37 不在 GitHub Runner 预装 SDK 中，包名是 android-37.0（不是 android-37）
      - name: Setup Android SDK 37
        if: matrix.group == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 platform
        if: matrix.group == 'android'
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Install Linux packaging deps
        if: matrix.group == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          # jpackage 打 deb/rpm 需要的工具链：
          # rpm / fakeroot / binutils 是打包依赖，file 用于识别二进制架构。
          # AppImage 目标只是 `jpackage --type app-image`（免安装目录），不需要 appimagetool/fuse。
          sudo apt-get install -y --no-install-recommends rpm fakeroot binutils file

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      # 签名材料只通过环境变量注入，仓库内不出现任何密钥文件名或路径；
      # 构建阶段由 Gradle 解码 base64 到系统临时目录
      - name: Verify Android signing secrets
        if: matrix.group == 'android'
        shell: bash
        env:
          SIGNING_MATERIAL: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_MATERIAL" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法签名 Android 产物"
            exit 1
          fi

      - name: Run release group task
        run: ./gradlew release-${{ matrix.group }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ matrix.group == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.group == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.group == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.group == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 上传 build/release 目录下的所有文件（递归匹配）
          files: build/release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

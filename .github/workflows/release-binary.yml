name: Release Binary
# TODO 支持网页上手动发布时执行ci/cd
# TODO 发布前校验tag，commit，gradle.properties中版本是否一致

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 架构无关的组（仅需在一个平台上构建一次）
          - group: server
            os: ubuntu-latest
          - group: web
            os: ubuntu-latest

          # Android（架构无关；签名密钥由 repository secrets 注入）
          - group: android
            os: ubuntu-latest

          # Windows（提供 x64 和 arm64）
          - group: win
            os: windows-latest
          # ARM runner 上自定义 release-* 任务的嵌套 Gradle 构建会在收尾时
          # 稳定等待 60s 后超时（产物其实已生成），因此改为直接调打包任务。
          - group: win
            os: windows-11-arm

# TODO 编译mac产物
          # macOS（同时提供 Intel 和 Apple Silicon）
#          - group: mac
#            os: macos-15-intel          # Intel x64
#          - group: mac
#            os: macos-15          # Apple Silicon arm64

          # Linux（提供 x64 和 arm64；deb/rpm/AppImage 名称带架构后缀，互不冲突）
          - group: linux
            os: ubuntu-latest     # x64
          - group: linux
            os: ubuntu-24.04-arm  # arm64

    steps:
      - uses: actions/checkout@v7

      # 所有模块 toolchain 均为 Java 21，无需额外安装 JDK 25
      # （Oracle 发行版也不提供 windows/aarch64 的 JDK 25，会在 arm runner 上报错）
      - name: Set up JDK 21 (用于运行 Gradle 守护进程)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # v3 默认 packages 为 "tools platform-tools"，其中 legacy `tools` 包已从
      # Google 仓库下架，sdkmanager 会直接失败；v4 默认只装 platform-tools。
      - name: Setup Android SDK 37
        if: matrix.group == 'android'
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37 platform
        if: matrix.group == 'android'
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Install Linux packaging deps
        if: matrix.group == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          # jpackage 打 deb/rpm 需要的工具链：
          # rpm / fakeroot / binutils 是打包依赖，file 用于识别二进制架构。
          # AppImage 目标只是 `jpackage --type app-image`（免安装目录），不需要 appimagetool/fuse。
          sudo apt-get install -y --no-install-recommends rpm fakeroot binutils file

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      # 签名材料只通过环境变量注入，仓库内不出现任何密钥文件名或路径；
      # 构建阶段由 Gradle 解码 base64 到系统临时目录
      - name: Verify Android signing secrets
        if: matrix.group == 'android'
        shell: bash
        env:
          SIGNING_MATERIAL: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_MATERIAL" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法签名 Android 产物"
            exit 1
          fi

      # ARM runner 上 Gradle 9.9.2 在 jpackage 结束后收尾必现 60s 超时
      # （"Timeout waiting for concurrent jobs to complete"，产物其实已生成）。
      # 因此：关掉 VFS 监听和使用一次性 daemon，并按产物存在与否验收。
      - name: Build Windows ARM exe directly
        if: matrix.os == 'windows-11-arm'
        shell: bash
        env:
          FLAVOR_DATA: network
        run: |
          set +e
          ./gradlew :app:desktopApp:packageReleaseExe --no-daemon -Dorg.gradle.vfs.watch=false
          gradle_status=$?
          set -e
          exe=$(ls app/desktopApp/build/compose/binaries/main-release/exe/*.exe 2>/dev/null | head -1)
          if [ -z "$exe" ]; then
            echo "::error::未找到 ARM exe 产物（Gradle 退出码 $gradle_status）"
            exit 1
          fi
          if [ "$gradle_status" -ne 0 ]; then
            echo "::warning::Gradle 退出码 $gradle_status，但 exe 已生成，按产物验收"
          fi
          mkdir -p build/release
          cp "$exe" "build/release/sortrss-exe-arm64-network-${VERSION}.exe"

      - name: Run release group task
        if: matrix.os != 'windows-11-arm'
        run: ./gradlew release-${{ matrix.group }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ matrix.group == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.group == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.group == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.group == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 上传 build/release 目录下的所有文件（递归匹配）
          files: build/release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
